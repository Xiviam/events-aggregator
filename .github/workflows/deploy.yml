name: CI/CD and Deploy to LMS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install development dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Run Ruff linter
        run: .venv/bin/ruff check --output-format=github .

      - name: Check Ruff formatting
        run: .venv/bin/ruff format --check .

  test:
    name: Test (PostgreSQL)
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: events
          POSTGRES_DB: events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events -d events_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://events:events@127.0.0.1:5432/events_test
      EVENTS_PROVIDER_API_KEY: test
      PYTHONPATH: src
      RUN_POSTGRES_TESTS: "1"
      SYNC_ENABLED: "false"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install test dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Apply migrations
        run: .venv/bin/alembic upgrade head

      - name: Check models have migrations
        run: .venv/bin/alembic check

      - name: Run tests
        run: .venv/bin/pytest

  build:
    name: Build container
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Request LMS deployment
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
    steps:
      - name: Request deployment
        shell: bash
        run: |
          if [ -z "$LMS_API_KEY" ]; then
            echo "::error::LMS_API_KEY is not configured"
            exit 1
          fi

          payload="$(
            jq -cn \
              --arg image "$IMAGE" \
              --arg repository "$GITHUB_REPOSITORY" \
              '{image: $image, repository: $repository}'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-API-Key: ${LMS_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://lms.python-labs.ru/api/deploy-requests)"

          if [ "$http_code" != "200" ]; then
            echo "Deployment failed with status code $http_code"
            echo "Response body:"
            cat "$response_file"
            exit 1
          fi
