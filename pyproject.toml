[project]
name = "events-aggregator"
version = "0.1.0"
description = "Local event catalogue with registration backed by an Events Provider API"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.29,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "greenlet>=3.1,<3.2; python_version < '3.10'",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_aggregator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["events_aggregator"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
# Runtime-introspected Pydantic/SQLAlchemy annotations must stay valid on Python 3.9.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
